<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Five More Blocks · Controller</title>
<style>*{box-sizing:border-box}body{margin:0;background:#173438;color:#fff3d9;font:18px system-ui;padding:5vw;touch-action:manipulation}h1{font: bold 2.4rem Georgia;margin:.4em 0}button{font:700 1.2rem system-ui;color:#142d30;background:#ffd169;border:0;border-radius:14px;min-height:64px;padding:10px;touch-action:none;user-select:none;-webkit-user-select:none}button:active,.held{background:#fb8768}#pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:580px}#pad button:first-child{grid-column:2}#pad button:nth-child(2){grid-column:1}#pad button:last-child:nth-child(5){grid-column:1/-1}</style>
<h1>Five More Blocks</h1><p id="msg">Choose a role, then watch the projector.</p><div id="roles"><button data-role="dispatcher">Dispatch a pickup</button> <button data-role="driver">Drive the cab</button> <button data-role="runner">Be the runner</button></div><div id="pad"></div>
<div id="dispatchMap" hidden><canvas width="780" height="130" style="width:100%;max-width:780px"></canvas><p>Gold · taxi　 Coral · pickup　 Silver · traffic</p><p id="towInfo"></p><button id="reroute" disabled>Mark alternate crossing</button><p id="arrival"></p></div><script>
let viewedRound='';
document.querySelector('#reroute').onclick=async()=>{
 try{const r=await post('reroute',{role,token,roundId:viewedRound});msg.textContent=r.ok?'Waypoint sent to driver.':'The crossing has changed.'}catch{msg.textContent='Could not send. Tap again.'}
};
async function showMap(){
 const box=document.querySelector('#dispatchMap');box.hidden=role!=='dispatcher'||!token;if(box.hidden)return;
 try{const {map,muni}=await (await fetch('/ROOM_ID/map')).json();document.querySelector('#arrival').textContent=muni;
 const ctx=box.querySelector('canvas').getContext('2d');ctx.fillStyle='#243f42';ctx.fillRect(0,0,780,130);ctx.fillStyle='#687574';ctx.fillRect(0,30,780,64);
 ctx.font='18px system-ui';ctx.fillStyle='#fff2d3';['Battery','Front','Drumm'].forEach((name,i)=>ctx.fillText(name,[308,508,700][i]-25,24));
 viewedRound=map?.roundId||'';
 document.querySelector('#reroute').disabled=!(map?.active&&map.towTarget);
 document.querySelector('#towInfo').textContent=map?.active&&map.towTarget?'Tow operator targeting '+map.towTarget+' crossing.':'';
 if(!map?.active)return;
 for(const [p,color] of [...map.queue.map(p=>[p,'#c9ceca']),[map.tow,'#ff942d'],[map.pickup,'#ff8267'],[map.cab,'#ffcc45']]){
 if(!p)continue;ctx.fillStyle=color;ctx.beginPath();ctx.arc(p[0],Math.max(40,Math.min(118,p[1]-345)),8,0,7);ctx.fill()}
 }catch{}
}
setInterval(showMap,600);

let role,token,seq=0,jumps=0;const held=new Map();
const msg=document.querySelector('#msg'),pad=document.querySelector('#pad'),roles=document.querySelector('#roles');
function post(endpoint,data){return fetch('/ROOM_ID/'+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),signal:AbortSignal.timeout(1600)})}
async function input(){if(!token)return;
try{const res=await post('input',{role,token,seq:++seq,jump:jumps,keys:[...held.values()]});if(res.status===403){token=null;held.clear();pad.replaceChildren();roles.hidden=false;msg.textContent='Connection expired. Choose a role again.'}}
catch{held.clear()}}
roles.onclick=async e=>{const choice=e.target.dataset.role;if(!choice||token)return;roles.hidden=true;
try{const res=await post('claim',{role:choice});if(!res.ok)throw Error('That seat is taken. Try the other role.');role=choice;token=(await res.json()).token;msg.textContent=role==='driver'?'Driver · Hold gas and steer toward the runner.':'Runner · Get close to the cab and tap Board. Tap again for boost once aboard.';
if(role==='dispatcher'){
 msg.textContent='Start Ferry Building pickup on the projector, then choose a corner.';
 for(const [corner,label] of ['Market & Battery','Market & Front','Market & Drumm'].entries()){
 const b=document.createElement('button');b.textContent=label;pad.append(b);
 b.onclick=async()=>{try{const result=await post('dispatch',{role,token,corner});msg.textContent=result.ok?'Sent · '+label:'Reconnect to dispatch.'}catch{msg.textContent='Could not send. Tap to retry.'}}
 }
 return;
}
const buttons=role==='driver'?[['Gas','ArrowUp'],['Left','ArrowLeft'],['Reverse','ArrowDown'],['Right','ArrowRight'],['Slide','ShiftLeft']]:[['Up','KeyW'],['Left','KeyA'],['Down','KeyS'],['Right','KeyD'],['Board / Boost','jump']];
for(const [label,key] of buttons){const b=document.createElement('button');b.textContent=label;pad.append(b);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(key==='jump')jumps++;else held.set(e.pointerId,key);b.classList.add('held');input()};b.onlostpointercapture=e=>{held.delete(e.pointerId);b.classList.remove('held');input()}}
}catch(error){roles.hidden=false;msg.textContent=error.message}}
setInterval(input,180);addEventListener('blur',()=>{held.clear();input()});
</script></html>
